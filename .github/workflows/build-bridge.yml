name: Build Telemetry Bridge (Windows .exe)

on:
  push:
    tags: ['bridge-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install pyinstaller aiohttp psutil pyaccsharedmemory

      - name: Build the one-file exe
        shell: bash
        run: |
          mkdir -p bridge
          cp public/telemetry_bridge.py bridge/
          cd bridge
          pyinstaller --onefile --name SimSetAppBridge \
            --hidden-import psutil --hidden-import aiohttp \
            --hidden-import pyaccsharedmemory --collect-all pyaccsharedmemory \
            telemetry_bridge.py --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimSetAppBridge
          path: bridge/dist/SimSetAppBridge.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bridge/dist/SimSetAppBridge.exe
