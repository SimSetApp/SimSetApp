# GitHub Actions workflow that builds a single double-clickable SimSetAppBridge.exe.
#
# The platform can't write to .github/workflows/ for you, so:
#   1. Copy this file to  .github/workflows/build-bridge.yml  in your repo.
#   2. Push a tag like  bridge-v1  (or run it manually from the Actions tab).
# The workflow builds the one-file exe on a Windows runner and publishes it to
# GitHub Releases — no Python or tools installed on your computer.
#
# Public download URL once released (use this in BridgeSteps.jsx → EXE_URL):
#   https://github.com/<USER>/<REPO>/releases/latest/download/SimSetAppBridge.exe

name: Build Telemetry Bridge (Windows .exe)

on:
  push:
    tags: ['bridge-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install pyinstaller websockets psutil

      - name: Build the one-file exe
        working-directory: src/companion
        run: pyinstaller telemetry_bridge.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimSetAppBridge
          path: src/companion/dist/SimSetAppBridge.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/companion/dist/SimSetAppBridge.exe